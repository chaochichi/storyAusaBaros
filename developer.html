<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ผู้จัดทำ — อุสา บารส</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:url('https://chaochichi.github.io/storyAusaBaros/bg_screen4.png') center center/cover no-repeat;
  overflow-y:auto;
  overflow-x:hidden;
}

/* รูปเต็มหน้าจอ ไม่ crop */
.dev-img{
  width:100%;
  display:block;
  min-height:100vh;
  object-fit:contain;
  object-position:top;
}

/* ปุ่ม Home ลอยขวาล่าง */
.home-btn-float{
  position:fixed;
  bottom:24px;right:20px;
  width:60px;height:60px;
  border-radius:50%;
  cursor:pointer;
  z-index:9999;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 6px 20px rgba(0,0,0,0.5);
  overflow:hidden;
  background:transparent;
  border:none;padding:0;
}
.home-btn-float img{
  width:100%;height:100%;
  object-fit:contain;display:block;
}
.home-btn-float:active{
  transform:scale(.88);
  box-shadow:0 3px 10px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<!-- รูปข้อมูลผู้จัดทำเต็มหน้าจอ -->
<img class="dev-img"
  src="https://chaochichi.github.io/storyAusaBaros/bgDeveloper.png"
  alt="ข้อมูลผู้จัดทำ">

<!-- ปุ่ม Home กลับ index -->
<button class="home-btn-float" onclick="goHome()" title="กลับหน้าแรก">
  <img src="https://chaochichi.github.io/storyAusaBaros/btn_home.png" alt="Home">
</button>

<script>
function goHome() {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
