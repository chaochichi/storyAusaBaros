<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>แบบทดสอบก่อนเรียน — อุสา บารส</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-light:#f0d080;--cream:#fdf6e3}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  background:url('https://chaochichi.github.io/storyAusaBaros/ChatGPT%20Image%2025%20%E0%B8%9E.%E0%B8%84.%202569%2015_29_18.png') center center/cover no-repeat fixed;
}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg,#00000066 0%,#00000099 100%);z-index:0}
.container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
.header{text-align:center;margin-bottom:16px;padding:18px 14px;
  background:linear-gradient(135deg,#2a150599,#5c331799);
  border-radius:20px;border:2px solid #c9a84c77;
  backdrop-filter:blur(10px);box-shadow:0 8px 32px #00000088}
.badge{display:inline-block;background:linear-gradient(90deg,#8b1a1a,#c0392b);color:#fdf6e3;
  font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;letter-spacing:1px;margin-bottom:8px}
.header h1{font-size:20px;font-weight:800;color:var(--gold-light);text-shadow:0 2px 12px #000;line-height:1.4}
.header p{font-size:12px;color:#c9a84caa;margin-top:4px}
.std{display:inline-block;background:#c9a84c22;border:1px solid #c9a84c44;color:var(--gold);
  font-size:11px;padding:2px 10px;border-radius:8px;margin:2px}
.prog-bar{background:#ffffff22;border-radius:10px;height:8px;overflow:hidden;margin-bottom:4px}
.prog-fill{background:linear-gradient(90deg,var(--gold),var(--gold-light));height:8px;border-radius:10px;
  transition:width .5s;box-shadow:0 0 10px #c9a84c99}
.prog-txt{display:flex;justify-content:space-between;font-size:12px;color:#c9a84caa;margin-bottom:14px}
.q-card{background:linear-gradient(135deg,#2a150599,#3d1f0899);
  border-radius:20px;border:1.5px solid #c9a84c55;padding:20px 16px;margin-bottom:12px;
  backdrop-filter:blur(12px);box-shadow:0 8px 32px #00000077;animation:fu .35s ease}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:17px;font-weight:700;color:var(--cream);line-height:1.65;margin-bottom:16px;text-shadow:0 1px 4px #000}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:flex;align-items:center;gap:12px;background:#ffffff11;border:1.5px solid #c9a84c33;
  border-radius:14px;padding:12px 14px;cursor:pointer;font-size:15px;color:#fdf6e3cc;
  transition:all .2s;font-family:'Sarabun',sans-serif;text-align:left;width:100%;
  backdrop-filter:blur(4px)}
.choice:hover:not(.disabled){border-color:var(--gold);background:#c9a84c22;color:var(--cream);transform:translateX(4px)}
.lbl{width:30px;height:30px;border-radius:50%;background:#c9a84c22;border:1.5px solid #c9a84c55;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
  color:var(--gold);flex-shrink:0;transition:all .2s}
.choice.correct{border-color:#2ecc71!important;background:#2ecc7122!important;color:#a8f0c4!important}
.choice.correct .lbl{background:#2ecc71!important;color:#fff!important;border-color:#2ecc71!important}
.choice.wrong{border-color:#e74c3c!important;background:#e74c3c22!important;color:#f5b8b2!important}
.choice.wrong .lbl{background:#e74c3c!important;color:#fff!important;border-color:#e74c3c!important}
.choice.disabled{cursor:default;transform:none!important}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.6;display:none}
.fb.show{display:block;animation:fu .2s ease}
.fb.correct{background:#2ecc7122;border-left:4px solid #2ecc71;color:#a8f0c4}
.fb.wrong{background:#e74c3c22;border-left:4px solid #e74c3c;color:#f5b8b2}
.btn-next{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#2a1505;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;
  font-family:'Sarabun',sans-serif;transition:all .2s;margin-top:12px;box-shadow:0 4px 16px #c9a84c55}
.btn-next:hover{opacity:.9;transform:translateY(-2px)}
.btn-next:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}
.saving{position:fixed;inset:0;z-index:100;background:#00000099;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
.saving.show{display:flex}
.spin{width:48px;height:48px;border:4px solid #c9a84c33;border-top-color:var(--gold);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.saving p{color:var(--gold-light);font-size:15px;font-weight:600}
.result-box{text-align:center}
.score-ring{width:130px;height:130px;border-radius:50%;
  background:conic-gradient(var(--gold) var(--pct,0deg),#ffffff22 0);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  box-shadow:0 0 30px #c9a84c55;position:relative}
.score-ring::before{content:'';position:absolute;width:100px;height:100px;
  border-radius:50%;background:#1a0d00ee}
.si{position:relative;z-index:1;text-align:center}
.sb{font-size:34px;font-weight:800;color:var(--gold-light);line-height:1}
.sp2{font-size:13px;color:#c9a84caa}
.grade{font-size:22px;font-weight:800;color:var(--gold-light);margin-bottom:6px}
.gmsg{font-size:14px;color:#fdf6e3aa;margin-bottom:18px;line-height:1.5}
.sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.si2{background:#c9a84c11;border:1px solid #c9a84c33;border-radius:14px;padding:12px 8px;text-align:center}
.sn{font-size:24px;font-weight:800;color:var(--gold-light)}
.sl{font-size:12px;color:#c9a84caa;margin-top:2px}
.wl{text-align:left;background:#e74c3c11;border:1px solid #e74c3c33;border-radius:14px;
  padding:14px;margin-bottom:16px;max-height:200px;overflow-y:auto}
.wl h4{font-size:13px;color:#f5b8b2;margin-bottom:8px}
.wi{font-size:13px;color:#fdf6e3aa;margin-bottom:8px;padding:8px 10px;
  background:#ffffff08;border-radius:8px;border-left:3px solid #e74c3c}
.wi strong{color:#2ecc71}
.saved-note{background:#2ecc7122;border:1px solid #2ecc7144;border-radius:12px;
  padding:10px 14px;font-size:13px;color:#a8f0c4;margin-bottom:14px}
.btn-retry{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#2a1505;
  border:none;border-radius:14px;padding:13px 28px;font-size:15px;font-weight:800;
  cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .2s;box-shadow:0 4px 16px #c9a84c44}
.btn-retry:hover{opacity:.9;transform:translateY(-2px)}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="saving" id="saving"><div class="spin"></div><p>กำลังบันทึกคะแนน...</p></div>
<div class="container">
  <div class="header">
    <div class="badge">📜 PRE-TEST</div>
    <h1>แบบทดสอบก่อนเรียน<br>"อุสา บารส"</h1>
    <p>ชุด เล่าตำนาน นิทานพื้นบ้านอีสาน | 15 ข้อ</p>
    <div style="margin-top:8px">
      <span class="std">ส 4.2 ป.3/2</span>
      <span class="std">ส 4.2 ป.3/3</span>
    </div>
  </div>
  <div id="quiz-area"></div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwGEbPnISaWHzrQlorwIOxWOM9u_NIM-zuRVuEsRUM-ccwPxyTDXrpobLTdGewHAAOdaQ/exec";
const params=new URLSearchParams(window.location.search);
const studentName=params.get('name')||'นักเรียน';
const questions=[
  {q:'ตำนาน "อุสา บารส" เป็นนิทานพื้นบ้านของภาคใดของประเทศไทย?',choices:['ภาคเหนือ','ภาคอีสาน','ภาคกลาง','ภาคใต้'],ans:1,explain:'อุสา บารส เป็นตำนานพื้นบ้านของภาคอีสาน ที่สืบทอดกันมาอย่างยาวนาน'},
  {q:'นางอุสาถูกพระบิดาสร้างสิ่งใดให้อยู่อาศัย เพื่อไม่ให้พบกับชายหนุ่ม?',choices:['พระราชวัง','หอสูง','ถ้ำ','เรือนแพ'],ans:1,explain:'พระยาพาน สร้างหอสูงให้นางอุสาอยู่อาศัย เพื่อไม่ให้พบกับชายหนุ่ม'},
  {q:'ท้าวบารสพบกับนางอุสาครั้งแรกได้อย่างไร?',choices:['พบกันที่ตลาด','พบกันในงานบุญ','ท้าวบารสเห็นกระทงที่นางอุสาลอยมา','ท้าวบารสปีนหอขึ้นไปพบ'],ans:2,explain:'ท้าวบารสพบกระทงที่นางอุสาลอยอธิษฐานหาคู่ จึงตามกระทงไปจนพบนางอุสา'},
  {q:'สถานที่ท่องเที่ยวทางประวัติศาสตร์ที่เชื่อมโยงกับตำนานอุสา บารส อยู่ในจังหวัดใด?',choices:['ขอนแก่น','เลย','อุดรธานี','หนองบัวลำภู'],ans:2,explain:'อุทยานประวัติศาสตร์ภูพระบาท ซึ่งมีหอนางอุสา ตั้งอยู่ที่อำเภอบ้านผือ จังหวัดอุดรธานี'},
  {q:'สถานที่ในตำนานที่เรียกว่า "หอนางอุสา" ปัจจุบันอยู่ที่ใด?',choices:['อุทยานแห่งชาติภูกระดึง','อุทยานประวัติศาสตร์ภูพระบาท','วัดป่าภูก้อน','เขื่อนอุบลรัตน์'],ans:1,explain:'หอนางอุสาตั้งอยู่ในอุทยานประวัติศาสตร์ภูพระบาท อำเภอบ้านผือ จังหวัดอุดรธานี'},
  {q:'ตำนานอุสา บารส สอนคุณธรรมข้อใดเป็นหลัก?',choices:['ความขยันหมั่นเพียร','ความรัก ความซื่อสัตย์ และการเสียสละ','ความกล้าหาญในการรบ','ความประหยัดอดออม'],ans:1,explain:'ตำนานอุสา บารส สอนเรื่องความรัก ความซื่อสัตย์ และการเสียสละ'},
  {q:'ใครคือพ่อของนางอุสาในตำนาน?',choices:['ท้าวบารส','พระยาพาน','พระยาแถน','ท้าวก่ำกาดำ'],ans:1,explain:'พระยาพานเป็นพ่อของนางอุสา ผู้สร้างหอสูงเพื่อกักขังนางอุสาไว้'},
  {q:'ตำนานพื้นบ้านมีความสำคัญต่อชุมชนอย่างไร?',choices:['ใช้เพื่อสร้างความกลัว','สืบทอดวัฒนธรรมและคุณค่าของชุมชน','ใช้เพื่อสร้างรายได้','ใช้เพื่อสอนวิชาคณิตศาสตร์'],ans:1,explain:'ตำนานพื้นบ้านช่วยสืบทอดวัฒนธรรม ประเพณี และคุณค่าของชุมชนจากรุ่นสู่รุ่น'},
  {q:'การลอยกระทงในตำนานอุสา บารส มีความหมายว่าอย่างไร?',choices:['ขอพรให้ฝนตก','อธิษฐานหาคู่ครองที่ดี','ไหว้พระแม่คงคา','ส่งความชั่วร้ายออกไป'],ans:1,explain:'นางอุสาลอยกระทงเพื่ออธิษฐานหาคู่ครองที่ดี สะท้อนประเพณีความเชื่อของคนอีสาน'},
  {q:'วัฒนธรรมของชุมชนอีสานในตำนานอุสา บารส แตกต่างจากชุมชนอื่นอย่างไร?',choices:['มีประเพณีลอยกระทงเหมือนทุกภาค แต่เนื้อหาตำนานต่างกัน','ไม่มีความแตกต่างกันเลย','ชุมชนอีสานไม่มีตำนานพื้นบ้าน','วัฒนธรรมอีสานเหมือนกับภาคเหนือทุกอย่าง'],ans:0,explain:'แต่ละภาคมีประเพณีลอยกระทงเหมือนกัน แต่ตำนานที่เล่าต่างกันตามบริบทท้องถิ่น'},
  {q:'ข้อใดเป็นลักษณะสำคัญของนิทานพื้นบ้าน?',choices:['เป็นเรื่องจริงทางประวัติศาสตร์ล้วนๆ','เล่าสืบต่อกันมาและสะท้อนวิถีชีวิตของชุมชน','มีผู้แต่งคนเดียวและมีลิขสิทธิ์ชัดเจน','ใช้ภาษาทางการเสมอ'],ans:1,explain:'นิทานพื้นบ้านมีลักษณะเล่าสืบต่อกันมาในชุมชน สะท้อนวิถีชีวิตและคุณธรรมของคนในท้องถิ่น'},
  {q:'สถานที่ที่ปรากฏในตำนานอุสา บารส บอกให้เรารู้เรื่องอะไร?',choices:['บอกว่าสถานที่นั้นไม่มีคุณค่า','บอกว่าสถานที่นั้นมีความเป็นมาและเชื่อมโยงกับประวัติศาสตร์ท้องถิ่น','บอกว่าสถานที่นั้นเป็นของต่างชาติ','บอกว่าสถานที่นั้นห้ามเข้า'],ans:1,explain:'สถานที่ในตำนานเชื่อมโยงกับประวัติศาสตร์และวัฒนธรรมท้องถิ่น'},
  {q:'ถ้านักเรียนต้องการศึกษาวัฒนธรรมของชุมชนตนเอง ควรทำสิ่งใดก่อน?',choices:['ค้นคว้าจากอินเทอร์เน็ตเท่านั้น','สอบถามผู้ใหญ่ในชุมชนและศึกษาสถานที่จริงในท้องถิ่น','ไม่ต้องศึกษาเพราะไม่สำคัญ','รอให้ครูบอกข้อมูลทั้งหมด'],ans:1,explain:'การสอบถามผู้ใหญ่และศึกษาสถานที่จริงเป็นวิธีที่ดีที่สุดในการเรียนรู้วัฒนธรรมของชุมชน'},
  {q:'ตำนานอุสา บารส สะท้อนให้เห็นว่าคนในชุมชนอีสานให้คุณค่าเรื่องใด?',choices:['ชอบการต่อสู้และสงคราม','ให้คุณค่ากับความรัก ความซื่อสัตย์ และครอบครัว','ไม่ให้ความสำคัญกับประเพณี','ชอบแยกตัวออกจากสังคม'],ans:1,explain:'ตำนานอุสา บารส สะท้อนว่าคนอีสานให้คุณค่ากับความรักและความสัมพันธ์ในครอบครัวและชุมชน'},
  {q:'นักเรียนควรภูมิใจในตำนานพื้นบ้านท้องถิ่นของตนเองเพราะเหตุใด?',choices:['เพราะตำนานพื้นบ้านทำให้ได้เกรดดี','เพราะตำนานพื้นบ้านเป็นมรดกทางวัฒนธรรมที่บรรพบุรุษสร้างไว้','เพราะตำนานพื้นบ้านไม่มีที่ไหนในโลก','เพราะครูบังคับให้ภูมิใจ'],ans:1,explain:'ตำนานพื้นบ้านเป็นมรดกทางวัฒนธรรมอันมีค่าที่บรรพบุรุษสร้างสรรค์และสืบทอดมาให้'}
];
let cur=0,sc=0,answered=false;
const wl=[];
function render(){
  const a=document.getElementById('quiz-area');
  if(cur>=questions.length){showResult(a);return;}
  const q=questions[cur];
  const pct=Math.round((cur/questions.length)*100);
  a.innerHTML=`
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-txt"><span>ข้อ ${cur+1} / ${questions.length}</span><span>${pct}%</span></div>
    <div class="q-card">
      <div class="q-num">❓ ข้อที่ ${cur+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="choices">
        ${q.choices.map((c,i)=>`
          <button class="choice" id="c${i}" onclick="pick(${i})">
            <div class="lbl">${['ก','ข','ค','ง'][i]}</div>
            <span>${c}</span>
          </button>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
      <button class="btn-next" id="nb" onclick="next()" disabled>
        ${cur<questions.length-1?'ข้อถัดไป →':'ดูผลคะแนน 🏆'}
      </button>
    </div>`;
  answered=false;
}
function pick(i){
  if(answered)return;answered=true;
  const q=questions[cur];
  document.querySelectorAll('.choice').forEach(e=>e.classList.add('disabled'));
  const ch=document.getElementById('c'+i);
  if(i===q.ans){ch.classList.add('correct');sc++;}
  else{
    ch.classList.add('wrong');
    document.getElementById('c'+q.ans).classList.add('correct');
    wl.push({num:cur+1,q:q.q,correct:q.choices[q.ans]});
  }
  const fb=document.getElementById('fb');
  fb.className='fb show '+(i===q.ans?'correct':'wrong');
  fb.innerHTML=(i===q.ans?'✅ ถูกต้อง! ':'❌ ยังไม่ถูก — ')+q.explain;
  document.getElementById('nb').disabled=false;
}
function next(){cur++;render();}
async function saveScore(s){
  document.getElementById('saving').classList.add('show');
  try{
    await fetch(SCRIPT_URL,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:studentName,type:'pre',score:s})
    });
  }catch(e){console.log(e);}
  document.getElementById('saving').classList.remove('show');
}
async function showResult(a){
  await saveScore(sc);
  const pct=Math.round((sc/questions.length)*100);
  const deg=(sc/questions.length)*360;
  let grade,msg;
  if(pct>=80){grade='🏆 ยอดเยี่ยม!';msg='มีความรู้เรื่องอุสา บารส ดีมากแล้ว';}
  else if(pct>=60){grade='👍 ดี';msg='รู้จักตำนานอุสา บารส พอสมควร';}
  else if(pct>=40){grade='📚 พอใช้';msg='เรียนรู้เนื้อหาเพิ่มเติมได้นะคะ';}
  else{grade='💪 เริ่มต้นดี!';msg='เรียนรู้บทเรียนแล้วจะเข้าใจมากขึ้นเลย';}
  const wHTML=wl.length>0?`
    <div class="wl"><h4>📋 ข้อที่ตอบผิด</h4>
    ${wl.map(w=>`<div class="wi"><strong>ข้อ ${w.num}:</strong> ${w.q}<br>เฉลย: <strong>${w.correct}</strong></div>`).join('')}
    </div>`:`<p style="color:#a8f0c4;margin-bottom:14px;font-weight:700">🎉 ถูกทุกข้อ!</p>`;
  a.innerHTML=`
    <div class="q-card result-box">
      <div class="saved-note">✅ บันทึกคะแนนของ <strong>${studentName}</strong> แล้ว</div>
      <div class="score-ring" style="--pct:${deg}deg">
        <div class="si">
          <div class="sb">${sc}/${questions.length}</div>
          <div class="sp2">${pct}%</div>
        </div>
      </div>
      <div class="grade">${grade}</div>
      <div class="gmsg">${msg}<br>
        <span style="font-size:12px;color:#c9a84caa">คะแนนก่อนเรียนของ ${studentName}</span>
      </div>
      <div class="sg">
        <div class="si2"><div class="sn" style="color:#2ecc71">${sc}</div><div class="sl">ถูก</div></div>
        <div class="si2"><div class="sn" style="color:#e74c3c">${questions.length-sc}</div><div class="sl">ผิด</div></div>
        <div class="si2"><div class="sn">${pct}%</div><div class="sl">คะแนน</div></div>
      </div>
      ${wHTML}
      <button class="btn-retry" onclick="restart()">🔄 ทำใหม่อีกครั้ง</button>
    </div>`;
}
function restart(){cur=0;sc=0;wl.length=0;render();}
render();
</script>
</body>
</html>
