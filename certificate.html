<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกียรติบัตร — นิทานพื้นบ้านอุสา บารส</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Charm:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #1a0a2e 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* ===== LOADING ===== */
#loading {
  text-align: center;
  color: #f0d060;
}
.spinner {
  width: 56px; height: 56px;
  border: 4px solid rgba(240,208,96,0.2);
  border-top-color: #f0d060;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== ERROR ===== */
#error-box {
  display: none;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(240,208,96,0.4);
  border-radius: 16px;
  padding: 36px 28px;
  text-align: center;
  color: #f0d060;
  max-width: 380px;
}
#error-box .icon { font-size: 56px; margin-bottom: 12px; }
#error-box h2 { font-size: 1.3rem; margin-bottom: 10px; }
#error-box p { font-size: 0.95rem; color: rgba(240,208,96,0.8); line-height: 1.7; white-space: pre-line; }

/* ===== CERT WRAPPER ===== */
#cert-wrapper {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 520px;
  animation: fadeIn 0.8s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

/* ===== CERTIFICATE BOX ===== */
#certificate {
  position: relative;
  width: 100%;
  /* keep 3:2 aspect ratio */
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: 6px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

/* background image fills entire cert */
#cert-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

/* all text content sits on top of bg */
.cert-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* ── FIX 1: reduce top padding so "เกียรติบัตร" sits higher ── */
  padding: 6% 12% 7%;
  text-align: center;
}

.cert-title {
  font-family: 'Charm', serif;
  font-size: clamp(1.1rem, 4vw, 1.6rem);
  font-weight: 700;
  color: #8b1a1a;
  line-height: 1.2;
  /* small gap before title */
  margin-top: 0;
}

.cert-subtitle {
  font-size: clamp(0.55rem, 1.8vw, 0.78rem);
  color: #5c3d1e;
  margin-top: 1%;
  line-height: 1.3;
}

/* ── FIX 2: reduce gap between "มอบให้แก่" label and name ── */
.cert-presented-to {
  font-size: clamp(0.55rem, 1.8vw, 0.72rem);
  color: #5c3d1e;
  margin-top: 3%;
  margin-bottom: 0%;   /* was large, now 0 */
  font-weight: 600;
}

.cert-name {
  font-family: 'Charm', serif;
  font-size: clamp(0.9rem, 3.2vw, 1.3rem);
  font-weight: 700;
  color: #8b1a1a;
  line-height: 1.2;
  margin-top: 0;       /* tight to label */
}

.cert-body {
  font-size: clamp(0.5rem, 1.65vw, 0.68rem);
  color: #5c3d1e;
  line-height: 1.55;
  margin-top: 2%;
}

.cert-score {
  font-size: clamp(0.5rem, 1.65vw, 0.68rem);
  color: #8b1a1a;
  font-weight: 700;
  margin-top: 1.5%;
}

/* bottom row: date left, seal center, school right */
.cert-bottom {
  margin-top: auto;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 2%;
}

.cert-date-block {
  text-align: center;
  font-size: clamp(0.42rem, 1.4vw, 0.58rem);
  color: #5c3d1e;
  line-height: 1.6;
}

/* ── FIX 3: school seal — remove dark background with mix-blend-mode ── */
.cert-seal {
  width: clamp(36px, 9%, 54px);
  height: auto;
  /* multiply blends white areas to transparent, removes black bg */
  mix-blend-mode: multiply;
  filter: contrast(1.1);
}

.cert-school-block {
  text-align: center;
  font-size: clamp(0.42rem, 1.4vw, 0.58rem);
  color: #5c3d1e;
  line-height: 1.6;
}

/* ===== BUTTONS ===== */
.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  width: 100%;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'Sarabun', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  transition: transform 0.15s, opacity 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.6; cursor: default; }

.btn-dl {
  background: linear-gradient(135deg, #c8960c, #f0d060, #c8960c);
  color: #3a1800;
}
.btn-back {
  background: rgba(255,255,255,0.15);
  color: #f0d060;
  border: 1px solid rgba(240,208,96,0.4);
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p>กำลังโหลดเกียรติบัตร...</p>
</div>

<!-- ERROR -->
<div id="error-box">
  <div class="icon" id="err-icon">📚</div>
  <h2 id="err-title">ไม่พบข้อมูล</h2>
  <p id="err-msg"></p>
</div>

<!-- CERTIFICATE -->
<div id="cert-wrapper">
  <div id="certificate">
    <!-- พื้นหลัง -->
    <img id="cert-bg-img"
         src="https://chaochichi.github.io/storyAusaBaros/cert_bg.png"
         alt="" crossorigin="anonymous">

    <!-- เนื้อหา -->
    <div class="cert-content">
      <div class="cert-title">เกียรติบัตร</div>
      <div class="cert-subtitle">มอบให้แก่</div>

      <div class="cert-name" id="cert-student-name">—</div>

      <div class="cert-body">
        ผ่านการเรียนรู้สื่อดิจิทัลนวัตกรรมการศึกษา<br>
        นิทานพื้นบ้านอุสา บารส<br>
        และผ่านการประเมินทุกตอนตามเกณฑ์ที่กำหนด
      </div>

      <div class="cert-score" id="cert-score-line"></div>

      <div class="cert-bottom">
        <!-- วันที่ / ลายเซ็น ซ้าย -->
        <div class="cert-date-block">
          <div id="cert-date-val">—</div>
          <div>ครูผู้สอน</div>
          <div>นางวิภาพร ธรรมวิเศษ</div>
        </div>

        <!-- ตรากลาง -->
        <img class="cert-seal"
             id="cert-school-seal"
             src="https://chaochichi.github.io/storyAusaBaros/school_seal.png"
             alt="ตราโรงเรียน"
             crossorigin="anonymous">

        <!-- ข้อมูลโรงเรียน ขวา -->
        <div class="cert-school-block">
          <div>โรงเรียนบ้านโคกม่วย</div>
          <div>สพป.หนองบัวลำภู เขต 1</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ปุ่ม -->
  <div class="btn-row">
    <button class="btn btn-dl" id="btn-dl" onclick="downloadCert()">📥 บันทึกเกียรติบัตร</button>
  </div>
</div>

<script>
// ===== CONFIG =====
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSO-Lqb3L3mjc0FjxWQerRGZVRUsBPBj6m2MxR23wJsYq4dCFxaJ4Ij0GR2fcT4WmH/exec';
const PASS_SCORE = 12;
const MAX_SCORE  = 15;

// ===== HELPERS =====
const params      = new URLSearchParams(window.location.search);
const studentName = params.get('name') || '';

function showError(icon, title, msg) {
  document.getElementById('loading').style.display    = 'none';
  document.getElementById('cert-wrapper').style.display = 'none';
  document.getElementById('error-box').style.display  = 'block';
  document.getElementById('err-icon').textContent  = icon;
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent   = msg;
}

function showCert(name, postScore, dateStr) {
  document.getElementById('loading').style.display    = 'none';
  document.getElementById('error-box').style.display  = 'none';

  const pct = Math.round((postScore / MAX_SCORE) * 100);
  document.getElementById('cert-student-name').textContent = name;
  document.getElementById('cert-score-line').textContent =
    'คะแนน ' + postScore + ' จาก ' + MAX_SCORE + ' คะแนน (' + pct + '%)';

  let display = dateStr || '';
  try {
    const d = new Date(dateStr);
    if (!isNaN(d)) display = d.toLocaleDateString('th-TH', {year:'numeric',month:'long',day:'numeric'});
  } catch(e) {}
  if (!display) display = new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('cert-date-val').textContent = display;

  document.getElementById('cert-wrapper').style.display = 'flex';
}

// ===== LOAD DATA =====
async function loadData() {
  if (!studentName) {
    showError('❓','ไม่พบชื่อ','กรุณากลับไปป้อนชื่อก่อนนะคะ');
    return;
  }
  try {
    const res  = await fetch(SCRIPT_URL + '?action=get&name=' + encodeURIComponent(studentName));
    const data = await res.json();
    if (!data || data.status === 'not_found' || !data.name) {
      showError('📝','ยังไม่มีข้อมูล',
        'ไม่พบข้อมูลของ "' + studentName + '"\nกรุณาทำแบบทดสอบก่อนนะคะ');
      return;
    }
    const postScore = parseInt(data.post) || 0;
    if (postScore < PASS_SCORE) {
      showError('📚','ยังไม่ผ่านการทดสอบ',
        'คุณยังไม่ผ่านการทดสอบบทเรียนนี้');
      return;
    }
    showCert(data.name, postScore, data.date || '');
  } catch(err) {
    showError('⚠️','โหลดข้อมูลไม่ได้',
      'กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่นะคะ');
    console.error(err);
  }
}

// ===== DOWNLOAD — แปลงรูปเป็น base64 ก่อน แล้วค่อย capture =====
async function imgToBase64(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width  = img.naturalWidth  || img.width;
      c.height = img.naturalHeight || img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      try { resolve(c.toDataURL('image/png')); }
      catch(e) { resolve(url); } // fallback ถ้า CORS block
    };
    img.onerror = () => resolve(url);
    img.src = url + '?t=' + Date.now(); // bust cache
  });
}

async function downloadCert() {
  const btn = document.getElementById('btn-dl');
  btn.textContent = '⏳ กำลังสร้างรูป...';
  btn.disabled = true;

  try {
    // แปลงรูปพื้นหลัง + ตราเป็น base64 เพื่อให้ html2canvas ไม่ติด CORS
    const bgEl   = document.getElementById('cert-bg-img');
    const sealEl = document.getElementById('cert-school-seal');

    const bgB64   = await imgToBase64(bgEl.src);
    const sealB64 = await imgToBase64(sealEl.src);

    const origBg   = bgEl.src;
    const origSeal = sealEl.src;

    bgEl.src   = bgB64;
    sealEl.src = sealB64;

    // รอให้ browser อัปเดต DOM
    await new Promise(r => setTimeout(r, 200));

    const canvas = await html2canvas(document.getElementById('certificate'), {
      scale: 3,
      useCORS: true,
      allowTaint: true,
      backgroundColor: null,
      logging: false
    });

    // คืนค่า src เดิม
    bgEl.src   = origBg;
    sealEl.src = origSeal;

    const link = document.createElement('a');
    link.download = 'เกียรติบัตร_' + (studentName || 'certificate') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

  } catch(e) {
    alert('ไม่สามารถบันทึกได้ กรุณาลองกดค้างที่รูปเกียรติบัตรแล้วเลือก "บันทึกรูปภาพ" แทนนะคะ');
    console.error(e);
  }

  btn.innerHTML = '📥 บันทึกเกียรติบัตร';
  btn.disabled = false;
}

loadData();
</script>
</body>
</html>
