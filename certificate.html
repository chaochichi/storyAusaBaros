<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกียรติบัตร — นิทานพื้นบ้านอุสา บารส</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Charm:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;
  background:linear-gradient(135deg,#1a0a2e 0%,#2d1b4e 40%,#1a0a2e 100%);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:16px;
}

/* ─── LOADING ─── */
#loading{text-align:center;color:#f0d060;}
.spinner{
  width:52px;height:52px;
  border:4px solid rgba(240,208,96,0.2);
  border-top-color:#f0d060;border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 14px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── ERROR ─── */
#error-box{
  display:none;background:rgba(255,255,255,0.08);
  border:2px solid rgba(240,208,96,0.4);border-radius:16px;
  padding:32px 24px;text-align:center;color:#f0d060;max-width:360px;
}
#error-box .icon{font-size:52px;margin-bottom:10px;}
#error-box h2{font-size:1.25rem;margin-bottom:8px;}
#error-box p{font-size:.9rem;color:rgba(240,208,96,0.8);line-height:1.7;white-space:pre-line;}

/* ─── WRAPPER ─── */
#cert-wrapper{
  display:none;flex-direction:column;align-items:center;
  gap:14px;width:100%;max-width:560px;
  animation:fadeIn .7s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ─── CERTIFICATE ─── */
/* 16:9 ตรงกับ cert_bg.png จริง */
#certificate{
  position:relative;width:100%;aspect-ratio:16/9;
  overflow:hidden;border-radius:6px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
}
#cert-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;display:block;
}

/* ─── OVERLAY ─── */
.cert-overlay{position:absolute;inset:0;}

/* ─── กรอบ 1 (y=14.7–29.4%): เกียรติบัตร + มอบให้แก่ ─── */
.cert-head{
  position:absolute;
  top:5.3%;left:15%;right:15%;
  height:14.7%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;line-height:1.2;
}
.cert-title{
  font-family:'Charm',serif;
  font-size:clamp(.85rem,3vw,1.45rem);
  font-weight:700;color:#6b1212;display:block;
}
.cert-sub{
  font-size:clamp(.5rem,1.6vw,.68rem);
  font-weight:600;color:#4a2800;display:block;margin-top:.1em;
}

/* ─── กรอบ 2 (y=37.7–61.9%): ชื่อนักเรียน + เนื้อหา ─── */
.cert-name-wrap{
  position:absolute;
  top:31.8%;left:15%;right:15%;
  height:24.2%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;gap:4%;
}
.cert-name{
  font-family:'Charm',serif;
  font-size:clamp(.85rem,2.8vw,1.3rem);
  font-weight:700;color:#6b1212;line-height:1.1;
}
.cert-body-wrap{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  line-height:1.55;
  font-size:clamp(.45rem,1.5vw,.62rem);
  color:#3a1800;
}

/* ─── กรอบ 3 (y=67.1–74.6%): ผ่าน X% ─── */
.cert-score-wrap{
  position:absolute;
  top:67.5%;left:20%;right:20%;
  height:7.5%;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
}
.cert-score{
  font-family:'Charm',serif;
  font-size:clamp(.7rem,2.2vw,1rem);
  font-weight:700;color:#6b1212;
}

/* ─── 6: ตราสำนักงานเขต → กลางล่าง ─── */
.cert-seal-wrap{
  position:absolute;
  bottom:4%;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;
}
.seal-img{
  width:clamp(32px,8%,50px);height:auto;
  mix-blend-mode:multiply;display:block;
}

/* ─── BUTTONS ─── */
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;}
.btn{
  padding:9px 22px;border:none;border-radius:50px;
  cursor:pointer;font-family:'Sarabun',sans-serif;
  font-size:.92rem;font-weight:600;
  transition:transform .15s,opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.6;cursor:default;}
.btn-dl{background:linear-gradient(135deg,#c8960c,#f0d060,#c8960c);color:#3a1800;}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>กำลังโหลดเกียรติบัตร...</p>
</div>

<div id="error-box">
  <div class="icon" id="err-icon">📚</div>
  <h2 id="err-title">ไม่พบข้อมูล</h2>
  <p id="err-msg"></p>
</div>

<div id="cert-wrapper">
  <div id="certificate">

    <!-- พื้นหลัง -->
    <img id="cert-bg-img"
         src="https://chaochichi.github.io/storyAusaBaros/cert_bg.png"
         alt="" crossorigin="anonymous">

    <div class="cert-overlay">

      <!-- กรอบ 1: เกียรติบัตร + มอบให้แก่ -->
      <div class="cert-head">
        <span class="cert-title">เกียรติบัตร</span>
        <span class="cert-sub">มอบให้แก่</span>
      </div>

      <!-- กรอบ 2: ชื่อนักเรียน + เนื้อหา -->
      <div class="cert-name-wrap">
        <span class="cert-name" id="cert-student-name">—</span>
        <div class="cert-body-wrap">
          <p>ผ่านการเรียนรู้สื่อดิจิทัลนวัตกรรมการศึกษา</p>
          <p>นิทานพื้นบ้านอุสา บารส</p>
        </div>
      </div>

      <!-- กรอบ 3: ผ่าน X% -->
      <div class="cert-score-wrap">
        <span class="cert-score" id="cert-score-text">—</span>
      </div>

      <!-- 6: ตราสำนักงานเขต -->
      <div class="cert-seal-wrap">
        <img class="seal-img" id="cert-seal"
             src="https://chaochichi.github.io/storyAusaBaros/school_seal.png"
             alt="ตรา" crossorigin="anonymous">
      </div>

    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-dl" id="btn-dl" onclick="downloadCert()">
      📥 บันทึกเกียรติบัตร
    </button>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyK8ubAIAzvZguBFbR3M8hK_mmqjpw07K0IUuz4mSV7Da8oPfOvzLDcixk6CcVn_hYbJQ/exec';
const PASS_SCORE = 12;
const MAX_SCORE  = 15;

const params      = new URLSearchParams(window.location.search);
const studentName = params.get('name') || '';

function showError(icon, title, msg) {
  document.getElementById('loading').style.display     = 'none';
  document.getElementById('cert-wrapper').style.display= 'none';
  document.getElementById('error-box').style.display   = 'block';
  document.getElementById('err-icon').textContent  = icon;
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent   = msg;
}

function showCert(name, postScore) {
  document.getElementById('loading').style.display     = 'none';
  document.getElementById('error-box').style.display   = 'none';
  const pct = Math.round((postScore / MAX_SCORE) * 100);
  document.getElementById('cert-student-name').textContent = name;
  document.getElementById('cert-score-text').textContent   = 'ผ่าน ' + pct + '%';
  document.getElementById('cert-wrapper').style.display    = 'flex';
}

async function loadData() {
  if (!studentName) {
    showError('❓','ไม่พบชื่อ','กรุณากลับไปป้อนชื่อก่อนนะคะ');
    return;
  }
  try {
    const res  = await fetch(SCRIPT_URL + '?action=get&name=' + encodeURIComponent(studentName));
    const data = await res.json();
    if (!data || data.status === 'not_found' || !data.name) {
      showError('📝','ยังไม่มีข้อมูล',
        'ไม่พบข้อมูลของ "' + studentName + '"\nกรุณาทำแบบทดสอบก่อนนะคะ');
      return;
    }
    const postScore = parseInt(data.post) || 0;
    if (postScore < PASS_SCORE) {
      showError('📚','ยังไม่ผ่านการทดสอบ','คุณยังไม่ผ่านการทดสอบบทเรียนนี้');
      return;
    }
    showCert(data.name, postScore);
  } catch(err) {
    showError('⚠️','โหลดข้อมูลไม่ได้','กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่นะคะ');
  }
}

/* ─── DOWNLOAD ─── */
async function fetchBase64(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width  = img.naturalWidth  || 400;
      c.height = img.naturalHeight || 400;
      c.getContext('2d').drawImage(img, 0, 0);
      try { resolve(c.toDataURL('image/png')); } catch(e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url + '?nc=' + Date.now();
  });
}

async function sealRemoveBlack(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c   = document.createElement('canvas');
      c.width   = img.naturalWidth  || 200;
      c.height  = img.naturalHeight || 200;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      try {
        const d = ctx.getImageData(0, 0, c.width, c.height);
        for (let i = 0; i < d.data.length; i += 4) {
          if (d.data[i] < 60 && d.data[i+1] < 60 && d.data[i+2] < 60) d.data[i+3] = 0;
        }
        ctx.putImageData(d, 0, 0);
        resolve(c.toDataURL('image/png'));
      } catch(e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url + '?nc=' + Date.now();
  });
}

async function downloadCert() {
  const btn = document.getElementById('btn-dl');
  btn.textContent = '⏳ กำลังสร้างรูป...';
  btn.disabled = true;
  try {
    const bgEl   = document.getElementById('cert-bg-img');
    const sealEl = document.getElementById('cert-seal');
    const [bgB64, sealB64] = await Promise.all([
      fetchBase64(bgEl.src),
      sealRemoveBlack(sealEl.src)
    ]);
    const origBg = bgEl.src, origSeal = sealEl.src;
    if (bgB64)   bgEl.src   = bgB64;
    if (sealB64) sealEl.src = sealB64;
    sealEl.style.mixBlendMode = 'normal';
    await new Promise(r => setTimeout(r, 250));
    const canvas = await html2canvas(document.getElementById('certificate'), {
      scale:3, useCORS:true, allowTaint:true, backgroundColor:null, logging:false
    });
    bgEl.src = origBg; sealEl.src = origSeal;
    sealEl.style.mixBlendMode = 'multiply';
    const link = document.createElement('a');
    link.download = 'เกียรติบัตร_' + (studentName || 'cert') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    alert('ไม่สามารถบันทึกได้\nลองกดค้างที่รูปแล้วเลือก "บันทึกรูปภาพ" แทนนะคะ');
  }
  btn.innerHTML = '📥 บันทึกเกียรติบัตร';
  btn.disabled  = false;
}

loadData();
</script>
</body>
</html>
