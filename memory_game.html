<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เกม Memory Card — อุสา บารส</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;min-height:100vh;overflow-x:hidden;
  background:url('https://chaochichi.github.io/storyAusaBaros/ChatGPT%20Image%2025%20%E0%B8%9E.%E0%B8%84.%202569%2015_29_18.png') center/cover no-repeat fixed}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg,#fff9ee99,#fff3e0cc);z-index:0}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 10px 30px}

/* Header */
.header-img{width:100%;border-radius:16px;display:block;margin-bottom:12px;box-shadow:0 6px 24px #00000033}
.hud{display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#fff9eedd,#fff3e0dd);
  border-radius:16px;border:2px solid #ff9800;padding:10px 16px;margin-bottom:12px;
  backdrop-filter:blur(8px)}
.hud-item{text-align:center}
.hud-num{font-size:22px;font-weight:800;color:#e65100}
.hud-label{font-size:11px;color:#a0522d;font-weight:600}
.progress-bar{background:#ffe0b2;border-radius:8px;height:8px;margin-bottom:12px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#ff9800,#ffc107);height:8px;border-radius:8px;transition:width .4s}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}

/* Card */
.card{aspect-ratio:1;cursor:pointer;perspective:600px;position:relative}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,0,.2,1)}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;inset:0;border-radius:14px;
  backface-visibility:hidden;display:flex;align-items:center;justify-content:center}

/* Back face */
.card-back{
  background:url('https://chaochichi.github.io/storyAusaBaros/card_back.png') center/cover no-repeat;
  border:2px solid #ffd700;
  box-shadow:0 3px 12px #9c27b055}
.card-back::after{content:''}

/* Front face */
.card-front{background:linear-gradient(135deg,#fff9ee,#fff3e0);
  border:2px solid #ff9800;transform:rotateY(180deg);
  flex-direction:column;gap:4px;padding:6px;
  box-shadow:0 3px 10px #ff980033}
.card-front img{width:65%;height:65%;object-fit:contain}
.card-front .card-label{font-size:11px;font-weight:800;color:#5d2e00;text-align:center;line-height:1.2}
.card.matched .card-front{background:linear-gradient(135deg,#d5f5e3,#eafaf1);border-color:#27ae60}
.card.wrong .card-inner{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:rotateY(180deg)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}

/* Result */
.result{background:linear-gradient(135deg,#fff9eef0,#fff3e0f0);
  border-radius:20px;border:3px solid #ff9800;padding:22px 18px;
  text-align:center;backdrop-filter:blur(8px);display:none}
.result.show{display:block;animation:popIn .4s ease}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.result-emoji{font-size:56px;margin-bottom:10px}
.result-title{font-size:22px;font-weight:800;color:#e65100;margin-bottom:6px}
.result-msg{font-size:15px;color:#5d2e00;font-weight:600;line-height:1.6;margin-bottom:16px}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:#fff8e1;border:1.5px solid #ffe082;border-radius:12px;padding:10px}
.stat-num{font-size:22px;font-weight:800;color:#e65100}
.stat-label{font-size:12px;color:#a0522d}
.btn-retry{width:100%;padding:13px;background:linear-gradient(135deg,#ff9800,#ffc107);
  color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:'Sarabun',sans-serif;box-shadow:0 4px 14px #ff980055}
.btn-retry:hover{opacity:.9;transform:translateY(-1px)}

/* Combo */
.combo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:32px;font-weight:800;color:#ff9800;text-shadow:0 2px 8px #00000055;
  pointer-events:none;z-index:100;opacity:0;transition:all .3s}
.combo.show{opacity:1;transform:translate(-50%,-70%)}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="combo" id="combo"></div>

<div class="wrap">
  <img class="header-img" src="https://chaochichi.github.io/storyAusaBaros/Header.png" alt="อุสา บารส">

  <div class="hud">
    <div class="hud-item"><div class="hud-num" id="pairCount">0/8</div><div class="hud-label">คู่ที่จับได้</div></div>
    <div class="hud-item"><div class="hud-num" id="moves">0</div><div class="hud-label">ครั้งที่พลิก</div></div>
    <div class="hud-item"><div class="hud-num" id="timer">0</div><div class="hud-label">วินาที</div></div>
    <div class="hud-item"><div class="hud-num" id="score">0</div><div class="hud-label">คะแนน</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div class="grid" id="grid"></div>
  <div class="result" id="result"></div>
</div>

<script>
const BASE = 'https://chaochichi.github.io/storyAusaBaros/';

const pairs = [
  { id:'usa',      img:'card_usa.png',      label:'นางอุสา',       match:'เจ้าหญิงบนหอสูง' },
  { id:'baras',    img:'card_baras.png',    label:'ท้าวบารส',      match:'เจ้าชายนักรบ' },
  { id:'payan',    img:'card_payan.png',    label:'พระยาพาน',      match:'พ่อของนางอุสา' },
  { id:'tower',    img:'card_tower.png',    label:'หอนางอุสา',     match:'ภูพระบาท' },
  { id:'krathong', img:'card_krathong.png', label:'กระทง',         match:'อธิษฐานหาคู่' },
  { id:'lotus',    img:'card_lotus.png',    label:'ดอกบัว',        match:'สัญลักษณ์อีสาน' },
  { id:'heart',    img:'card_heart.png',    label:'ความรัก',       match:'คุณธรรมหลัก' },
  { id:'unesco',   img:'card_unesco.png',   label:'UNESCO',        match:'มรดกโลก' },
];

let cards = [], flipped = [], matched = 0, moves = 0, score = 0;
let canFlip = true, timerInterval, seconds = 0, combo = 0;
let gameStarted = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

function buildCards() {
  // Each pair has image card + text card
  const deck = [];
  pairs.forEach(p => {
    deck.push({ pairId: p.id, type: 'img', img: p.img, label: p.label });
    deck.push({ pairId: p.id, type: 'txt', label: p.match });
  });
  return shuffle(deck);
}

function init() {
  cards = buildCards();
  flipped = []; matched = 0; moves = 0; score = 0;
  seconds = 0; combo = 0; gameStarted = false;
  clearInterval(timerInterval);
  document.getElementById('pairCount').textContent = '0/8';
  document.getElementById('moves').textContent = '0';
  document.getElementById('timer').textContent = '0';
  document.getElementById('score').textContent = '0';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('result').className = 'result';
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cards.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.index = i;
    div.innerHTML = `
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front">
          ${c.type==='img'
            ? `<img src="${BASE}${c.img}" alt="${c.label}" loading="lazy"><div class="card-label">${c.label}</div>`
            : `<div style="font-size:14px;font-weight:800;color:#5d2e00;text-align:center;padding:6px;line-height:1.4">${c.label}</div>`
          }
        </div>
      </div>`;
    div.addEventListener('click', () => flipCard(i, div));
    grid.appendChild(div);
  });
}

function flipCard(idx, el) {
  if (!canFlip) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length >= 2) return;

  if (!gameStarted) {
    gameStarted = true;
    timerInterval = setInterval(() => {
      seconds++;
      document.getElementById('timer').textContent = seconds;
    }, 1000);
  }

  el.classList.add('flipped');
  flipped.push({ idx, el, data: cards[idx] });

  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    canFlip = false;
    setTimeout(checkMatch, 700);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const isMatch = a.data.pairId === b.data.pairId && a.data.type !== b.data.type;

  if (isMatch) {
    a.el.classList.add('matched');
    b.el.classList.add('matched');
    matched++;
    combo++;
    const pts = combo >= 3 ? 30 : combo === 2 ? 20 : 10;
    score += pts;
    if (combo >= 2) showCombo(combo >= 3 ? '🔥 COMBO x' + combo + '!' : '✨ NICE!');
    document.getElementById('pairCount').textContent = matched + '/8';
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = (matched / 8 * 100) + '%';
    if (matched === 8) { clearInterval(timerInterval); setTimeout(showResult, 600); }
  } else {
    combo = 0;
    a.el.classList.add('wrong');
    b.el.classList.add('wrong');
    setTimeout(() => {
      a.el.classList.remove('flipped', 'wrong');
      b.el.classList.remove('flipped', 'wrong');
    }, 500);
  }

  flipped = [];
  canFlip = true;
}

function showCombo(text) {
  const el = document.getElementById('combo');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

function showResult() {
  const stars = score >= 120 ? '⭐⭐⭐' : score >= 80 ? '⭐⭐' : '⭐';
  const grade = score >= 120 ? 'ยอดเยี่ยม! เก่งมากเลย!' : score >= 80 ? 'ดีมาก! เกือบสมบูรณ์แล้ว' : 'ทำได้ดี! ลองใหม่นะคะ';
  const r = document.getElementById('result');
  r.innerHTML = `
    <div class="result-emoji">🏆</div>
    <div class="result-title">${stars}</div>
    <div class="result-msg">${grade}</div>
    <div class="result-stats">
      <div class="stat-box"><div class="stat-num">${score}</div><div class="stat-label">คะแนนรวม</div></div>
      <div class="stat-box"><div class="stat-num">${moves}</div><div class="stat-label">ครั้งที่พลิก</div></div>
      <div class="stat-box"><div class="stat-num">${seconds}s</div><div class="stat-label">เวลาที่ใช้</div></div>
      <div class="stat-box"><div class="stat-num">8/8</div><div class="stat-label">คู่ที่จับได้</div></div>
    </div>
    <button class="btn-retry" onclick="init()">🔄 เล่นใหม่อีกครั้ง</button>`;
  r.className = 'result show';
  r.scrollIntoView({ behavior: 'smooth' });
}

init();
</script>
  <script src="home_btn.js"></script>
</body>
</html>
