<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หนังสือนิทานภาพ | อุสา-บารส</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #0d0a1a;
            background-image:
                radial-gradient(ellipse at top, #1e1040 0%, transparent 60%),
                radial-gradient(ellipse at bottom, #1a0a0a 0%, transparent 60%),
                radial-gradient(circle at center, #1a1030 0%, #080510 100%);
            color: #fff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER IMAGE ===== */
        .header-img-wrap {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 8px;
        }
        .header-img-wrap img {
            width: 100%;
            border-radius: 14px;
            display: block;
            box-shadow: 0 4px 24px rgba(200,150,12,0.25);
        }

        /* ===== NAVIGATION BAR ===== */
        .nav-bar {
            background: linear-gradient(135deg, rgba(42,21,5,0.7), rgba(92,51,23,0.5));
            border: 1px solid rgba(200,150,12,0.3);
            border-radius: 50px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(200,150,12,0.15);
            padding: 8px 16px;
        }

        .nav-btn {
            background: rgba(200,150,12,0.15);
            border: 1.5px solid rgba(200,150,12,0.4);
            color: #f0d060;
            border-radius: 50px;
            padding: 8px 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(200,150,12,0.35);
            border-color: rgba(200,150,12,0.7);
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(200,150,12,0.3);
        }
        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
        }

        .page-indicator {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(200,150,12,0.25);
            border-radius: 50px;
            padding: 4px 16px;
            color: rgba(240,208,96,0.8);
            font-size: 0.82rem;
            letter-spacing: 0.05em;
        }

        .book-title-text {
            color: #f0d060;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 8px rgba(200,150,12,0.5);
        }

        /* ===== BOOK CONTAINER ===== */
        .book-container {
            perspective: 2000px;
            width: 100%;
            max-width: 680px;
            height: 72vh;
            max-height: 820px;
            position: relative;
            margin: 0 auto;
            /* Golden glow around book */
            filter: drop-shadow(0 8px 32px rgba(200,150,12,0.2));
        }

        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #1a1020;
            box-shadow:
                0 20px 50px rgba(0,0,0,0.7),
                0 0 0 1px rgba(200,150,12,0.2),
                inset 0 0 30px rgba(200,150,12,0.05);
            transition: transform 0.65s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.65s ease-in-out;
            transform-style: preserve-3d;
            transform-origin: left center;
            border-radius: 4px 16px 16px 4px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* สันหนังสือ */
        .page::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 32px;
            background: linear-gradient(to right,
                rgba(200,150,12,0.15) 0%,
                rgba(0,0,0,0.4) 30%,
                rgba(0,0,0,0) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* กรอบทองขอบหน้าหนังสือ */
        .page::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 4px 16px 16px 4px;
            border: 1px solid rgba(200,150,12,0.15);
            pointer-events: none;
            z-index: 10;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #0d0a18;
        }

        .page-enter        { opacity: 0; transform: rotateY(90deg) scale(0.95); }
        .page-enter-active { opacity: 1; transform: rotateY(0) scale(1); }
        .page-exit         { opacity: 1; transform: rotateY(0) scale(1); }
        .page-exit-active  { opacity: 0; transform: rotateY(-90deg) scale(0.95); }
        .page-enter-reverse { opacity: 0; transform: rotateY(-90deg) scale(0.95); }
        .page-exit-reverse  { opacity: 0; transform: rotateY(90deg) scale(0.95); }

        /* ===== FOOTER ===== */
        .footer-hint {
            color: rgba(200,150,12,0.4);
            font-size: 0.78rem;
        }
    </style>
</head>
<body class="p-3 sm:p-5">

    <!-- Header Image -->
    <div class="header-img-wrap mb-3 flex-none">
        <img src="https://chaochichi.github.io/storyAusaBaros/Header.png" alt="อุสา บารส">
    </div>

    <!-- Navigation Bar -->
    <div class="flex-none w-full max-w-4xl mx-auto mb-3">
        <div class="nav-bar flex justify-between items-center">
            <button id="prevBtn" class="nav-btn" aria-label="หน้าก่อนหน้า">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span class="hidden sm:inline">ก่อนหน้า</span>
            </button>

            <div class="flex flex-col items-center gap-1">
                <span class="book-title-text">📖 นิทานภาพ อุสา-บารส</span>
                <div id="pageIndicator" class="page-indicator">หน้า 1 / 19</div>
            </div>

            <button id="nextBtn" class="nav-btn" aria-label="หน้าถัดไป">
                <span class="hidden sm:inline">ถัดไป</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Book Viewer -->
    <div class="flex-grow flex items-center justify-center w-full">
        <div id="bookViewer" class="book-container"></div>
    </div>

    <!-- Footer -->
    <div class="flex-none text-center mt-3 mb-2 footer-hint">
        <p>💡 ใช้ปุ่ม ⬅️ ➡️ บนคีย์บอร์ด หรือปัดหน้าจอซ้าย-ขวา เพื่อเปลี่ยนหน้า</p>
    </div>

    <script>
        const BASE = 'https://chaochichi.github.io/storyAusaBaros/';

        const images = [
            "ebook_01.jpg","ebook_02.jpg","ebook_03.jpg","ebook_04.jpg",
            "ebook_05.jpg","ebook_06.jpg","ebook_07.jpg","ebook_08.jpg",
            "ebook_09.jpg","ebook_10.jpg","ebook_11.jpg","ebook_12.jpg",
            "ebook_13.jpg","ebook_14.jpg","ebook_15.jpg","ebook_16.jpg",
            "ebook_17.jpg","ebook_18.jpg","ebook_19.jpg"
        ].map(f => BASE + f);

        let currentPageIndex = 0;
        let isAnimating = false;

        const bookViewer   = document.getElementById('bookViewer');
        const prevBtn      = document.getElementById('prevBtn');
        const nextBtn      = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');

        function renderPage(index, direction = 'next') {
            if (isAnimating) return;
            isAnimating = true;

            const totalPages = images.length;
            pageIndicator.textContent = `หน้า ${index + 1} / ${totalPages}`;
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === totalPages - 1;

            const pageEl = document.createElement('div');
            pageEl.className = 'page';

            if (bookViewer.children.length === 0) {
                pageEl.classList.add('page-enter-active');
            } else {
                pageEl.classList.add(direction === 'next' ? 'page-enter' : 'page-enter-reverse');
            }

            pageEl.innerHTML = `
                <img src="${images[index]}" alt="หน้า ${index + 1}"
                     onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100%\\' height=\\'100%\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%230d0a18\\'/><text x=\\'50%\\' y=\\'50%\\' font-family=\\'sans-serif\\' font-size=\\'18\\' text-anchor=\\'middle\\' fill=\\'%23c8960c\\'>ไม่พบรูปภาพ</text></svg>';"
                     loading="lazy" draggable="false">
            `;

            const currentPages = bookViewer.querySelectorAll('.page');
            bookViewer.appendChild(pageEl);

            if (currentPages.length > 0) {
                const oldPage = currentPages[currentPages.length - 1];
                void pageEl.offsetWidth;

                pageEl.classList.remove('page-enter', 'page-enter-reverse');
                pageEl.classList.add('page-enter-active');
                pageEl.style.transform = 'rotateY(0) scale(1)';
                pageEl.style.opacity   = '1';

                oldPage.style.transform = direction === 'next'
                    ? 'rotateY(-90deg) scale(0.95)'
                    : 'rotateY(90deg) scale(0.95)';
                oldPage.style.opacity = '0';

                setTimeout(() => {
                    if (bookViewer.contains(oldPage)) bookViewer.removeChild(oldPage);
                    isAnimating = false;
                }, 650);
            } else {
                isAnimating = false;
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentPageIndex < images.length - 1 && !isAnimating) {
                currentPageIndex++;
                renderPage(currentPageIndex, 'next');
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentPageIndex > 0 && !isAnimating) {
                currentPageIndex--;
                renderPage(currentPageIndex, 'prev');
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') nextBtn.click();
            else if (e.key === 'ArrowLeft') prevBtn.click();
        });

        let touchstartX = 0, touchendX = 0;
        document.body.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});
        document.body.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            const diff = touchstartX - touchendX;
            if (Math.abs(diff) > 50) diff > 0 ? nextBtn.click() : prevBtn.click();
        }, {passive: true});

        // Preload all images
        window.addEventListener('load', () => {
            images.forEach(src => { const img = new Image(); img.src = src; });
        });

        renderPage(currentPageIndex);
    </script>
</body>
</html>
