<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Book อุสา บารส</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;
  background:#0a0a1a;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:8px;
  overflow:hidden;
}

/* BOOK CONTAINER */
#book-wrap{
  width:100%;max-width:860px;
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
}

/* PAGE DISPLAY */
#page-container{
  width:100%;
  position:relative;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,0.8);
  cursor:pointer;
  background:#111;
}
#page-img{
  width:100%;
  display:block;
  transition:opacity .3s ease;
}
#page-img.loading{opacity:0.3}

/* SWIPE ZONES */
.swipe-zone{
  position:absolute;top:0;bottom:0;width:30%;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
  cursor:pointer;
}
.swipe-zone:hover{opacity:1}
#zone-prev{left:0;background:linear-gradient(to right,rgba(0,0,0,0.4),transparent)}
#zone-next{right:0;background:linear-gradient(to left,rgba(0,0,0,0.4),transparent)}
.zone-arrow{
  font-size:clamp(1.5rem,4vw,2.5rem);
  color:rgba(255,255,255,0.9);
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

/* PAGE NUMBER */
#page-num{
  position:absolute;bottom:8px;right:12px;
  background:rgba(0,0,0,0.6);
  color:#f0d060;font-size:.75rem;font-weight:600;
  padding:3px 10px;border-radius:20px;
  backdrop-filter:blur(4px);
}

/* CONTROLS */
.controls{
  display:flex;align-items:center;gap:10px;
  padding:4px 0;
}
.ctrl-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(200,150,12,0.2);
  border:1.5px solid rgba(200,150,12,0.5);
  color:#f0d060;font-size:1.1rem;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.ctrl-btn:hover{background:rgba(200,150,12,0.4);transform:scale(1.1)}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

/* PROGRESS BAR */
.progress-wrap{
  display:flex;align-items:center;gap:8px;
}
.progress-bar{
  width:clamp(120px,40vw,240px);height:4px;
  background:rgba(255,255,255,0.15);
  border-radius:4px;overflow:hidden;
  cursor:pointer;
}
.progress-fill{
  height:100%;
  background:linear-gradient(to right,#c8960c,#f0d060);
  border-radius:4px;
  transition:width .3s ease;
}
.page-label{
  font-size:.8rem;color:rgba(240,208,96,0.8);
  white-space:nowrap;min-width:60px;text-align:center;
}

/* THUMBNAIL STRIP */
#thumb-wrap{
  display:flex;gap:5px;
  overflow-x:auto;
  padding:4px 2px;
  max-width:100%;
  scrollbar-width:thin;
  scrollbar-color:rgba(200,150,12,0.4) transparent;
}
#thumb-wrap::-webkit-scrollbar{height:3px}
#thumb-wrap::-webkit-scrollbar-thumb{background:rgba(200,150,12,0.4);border-radius:2px}
.thumb{
  flex-shrink:0;
  width:clamp(48px,8vw,72px);
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:3px;
  cursor:pointer;
  border:2px solid transparent;
  transition:all .2s;opacity:0.6;
}
.thumb:hover{opacity:1;border-color:rgba(200,150,12,0.6)}
.thumb.active{opacity:1;border-color:#f0d060;box-shadow:0 0 6px rgba(200,150,12,0.6)}

/* TITLE */
.book-title{
  font-size:clamp(.8rem,2vw,1rem);
  color:rgba(240,208,96,0.7);
  letter-spacing:.05em;
}
</style>
</head>
<body>

<div id="book-wrap">
  <div class="book-title">📖 เล่าตำนาน นิทานพื้นบ้านอีสาน : อุสา บารส</div>

  <!-- Page Display -->
  <div id="page-container">
    <img id="page-img" src="" alt="หน้า e-Book" draggable="false">
    <div class="swipe-zone" id="zone-prev" onclick="prevPage()">
      <span class="zone-arrow">‹</span>
    </div>
    <div class="swipe-zone" id="zone-next" onclick="nextPage()">
      <span class="zone-arrow">›</span>
    </div>
    <div id="page-num">1 / 19</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-first" onclick="goPage(0)" title="หน้าแรก">⏮</button>
    <button class="ctrl-btn" id="btn-prev"  onclick="prevPage()" title="ก่อนหน้า">◀</button>

    <div class="progress-wrap">
      <div class="progress-bar" onclick="clickProgress(event)">
        <div class="progress-fill" id="progress-fill" style="width:5.26%"></div>
      </div>
      <div class="page-label" id="page-label">1 / 19</div>
    </div>

    <button class="ctrl-btn" id="btn-next"  onclick="nextPage()" title="ถัดไป">▶</button>
    <button class="ctrl-btn" id="btn-last"  onclick="goPage(18)" title="หน้าสุดท้าย">⏭</button>
  </div>

  <!-- Thumbnails -->
  <div id="thumb-wrap"></div>
</div>

<script>
const BASE = 'https://chaochichi.github.io/storyAusaBaros/';
const TOTAL = 19;
let current = 0;

// Build page URLs
const pages = Array.from({length: TOTAL}, (_,i) => {
  const n = String(i+1).padStart(2,'0');
  return BASE + `ebook_${n}.jpg`;
});

// Preload next image
function preload(idx) {
  if(idx >= 0 && idx < TOTAL) {
    const img = new Image();
    img.src = pages[idx];
  }
}

// Render thumbnails
function buildThumbs() {
  const wrap = document.getElementById('thumb-wrap');
  pages.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    img.className = 'thumb' + (i===0?' active':'');
    img.id = `thumb-${i}`;
    img.alt = `หน้า ${i+1}`;
    img.onclick = () => goPage(i);
    wrap.appendChild(img);
  });
}

function goPage(idx) {
  if(idx < 0 || idx >= TOTAL) return;

  // Update active thumb
  document.querySelector('.thumb.active')?.classList.remove('active');
  document.getElementById(`thumb-${idx}`)?.classList.add('active');

  // Scroll thumb into view
  document.getElementById(`thumb-${idx}`)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});

  // Update image
  const img = document.getElementById('page-img');
  img.classList.add('loading');
  const newImg = new Image();
  newImg.onload = () => {
    img.src = newImg.src;
    img.classList.remove('loading');
  };
  newImg.src = pages[idx];

  current = idx;
  updateUI();
  preload(idx + 1);
  preload(idx - 1);
}

function nextPage() { goPage(current + 1); }
function prevPage() { goPage(current - 1); }

function updateUI() {
  const pct = ((current + 1) / TOTAL * 100).toFixed(2);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('page-num').textContent   = `${current+1} / ${TOTAL}`;
  document.getElementById('page-label').textContent = `${current+1} / ${TOTAL}`;
  document.getElementById('btn-prev').disabled  = current === 0;
  document.getElementById('btn-first').disabled = current === 0;
  document.getElementById('btn-next').disabled  = current === TOTAL - 1;
  document.getElementById('btn-last').disabled  = current === TOTAL - 1;
}

function clickProgress(e) {
  const bar = e.currentTarget;
  const pct = e.offsetX / bar.offsetWidth;
  goPage(Math.floor(pct * TOTAL));
}

// Swipe support
let touchX = 0;
document.getElementById('page-container').addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
}, {passive:true});
document.getElementById('page-container').addEventListener('touchend', e => {
  const diff = touchX - e.changedTouches[0].clientX;
  if(Math.abs(diff) > 40) diff > 0 ? nextPage() : prevPage();
}, {passive:true});

// Keyboard
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
  if(e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevPage();
});

// Init
buildThumbs();
goPage(0);
</script>
</body>
</html>
