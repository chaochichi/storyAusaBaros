<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถามตอบนิทาน อุสา บารส</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold-light:#f0d080;
  --cream:#fdf6e3;--brown:#5c3317;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;
  min-height:100vh;overflow-x:hidden;
  background:url('https://chaochichi.github.io/storyAusaBaros/ChatGPT%20Image%2025%20%E0%B8%9E.%E0%B8%84.%202569%2015_29_18.png')
    center center/cover no-repeat fixed;
}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg,#00000077 0%,#000000aa 100%);z-index:0}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:12px 14px 16px;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;margin-bottom:10px;
  background:linear-gradient(135deg,#2a150599,#5c331799);
  border:1.5px solid #c9a84c66;border-radius:16px;
  backdrop-filter:blur(10px);
}
.header-avatar{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  overflow:hidden;border:2px solid #c9a84c88;
}
.header-info h2{font-size:.95rem;font-weight:700;color:var(--gold-light);line-height:1.2}
.header-info p{font-size:.7rem;color:#c9a84caa;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:#4caf50;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* CHAT */
#chat-area{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;gap:8px;
  padding:2px 0;min-height:280px;max-height:calc(100vh - 230px);
}
.msg{display:flex;gap:7px;align-items:flex-end;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{flex-direction:row}
.msg.user{flex-direction:row-reverse}
.msg-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.msg.bot .msg-av{background:transparent;overflow:hidden}
.msg.user .msg-av{background:transparent;overflow:hidden}
.msg-bubble{
  max-width:78%;padding:9px 13px;border-radius:16px;
  font-size:.88rem;line-height:1.55;
}
.msg.bot .msg-bubble{
  background:linear-gradient(135deg,#2a150599,#5c331788);
  border:1px solid #c9a84c44;color:#fdf6e3;
  backdrop-filter:blur(8px);border-bottom-left-radius:4px;
}
.msg.user .msg-bubble{
  background:linear-gradient(135deg,#4a1a6ecc,#7b2d8bcc);
  border:1px solid #c9a84c44;color:#fff;
  backdrop-filter:blur(8px);border-bottom-right-radius:4px;
}

/* TYPING */
.typing-dots{display:flex;gap:4px;padding:3px 0}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;
  background:#c9a84caa;animation:dot .8s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* QUICK */
.quick-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0}
.quick-btn{
  background:#c9a84c22;border:1px solid #c9a84c55;
  color:var(--gold);border-radius:20px;
  padding:5px 11px;font-size:.75rem;
  font-family:'Sarabun',sans-serif;
  cursor:pointer;transition:all .2s;
}
.quick-btn:hover{background:#c9a84c44;transform:translateY(-1px)}

/* INPUT */
.input-row{display:flex;gap:7px;padding:8px 0 0}
#user-input{
  flex:1;padding:10px 14px;
  background:#2a150566;
  border:1.5px solid #c9a84c55;border-radius:50px;
  color:var(--cream);font-family:'Sarabun',sans-serif;font-size:.88rem;
  outline:none;backdrop-filter:blur(8px);transition:border .2s;
}
#user-input::placeholder{color:#c9a84c55}
#user-input:focus{border-color:#c9a84c99}
#send-btn{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;transition:all .2s;flex-shrink:0;
}
#send-btn:hover{transform:scale(1.08)}
#send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="wrap">

  <div class="header">
    <div class="header-avatar"><img src="https://chaochichi.github.io/storyAusaBaros/ausa_chat.png" style="width:100%;height:100%;object-fit:cover;" alt="น้องอุสา"></div>
    <div class="header-info">
      <h2>น้องอุสา ผู้ช่วยนิทาน</h2>
      <p><span class="dot"></span>ถามตอบเรื่อง อุสา บารส</p>
    </div>
  </div>

  <div id="chat-area"></div>

  <div class="quick-wrap" id="quick-wrap">
    <button class="quick-btn" onclick="sendQuick('นางอุสาเป็นใคร?')">👸 นางอุสาเป็นใคร?</button>
    <button class="quick-btn" onclick="sendQuick('ท้าวบารสเป็นใคร?')">🤴 ท้าวบารสเป็นใคร?</button>
    <button class="quick-btn" onclick="sendQuick('หอนางอุสาอยู่ที่ไหน?')">🏛️ หอนางอุสา</button>
    <button class="quick-btn" onclick="sendQuick('นิทานเรื่องนี้สอนอะไร?')">💡 นิทานสอนอะไร?</button>
    <button class="quick-btn" onclick="sendQuick('เล่าเรื่องย่อให้ฟังหน่อยได้ไหม?')">📖 เรื่องย่อ</button>
  </div>

  <div class="input-row">
    <input type="text" id="user-input"
           placeholder="ถามเรื่องนิทานอุสา บารส..."
           onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="send-btn" onclick="sendMsg()">➤</button>
  </div>

</div>
<script>
const API_KEY='AIzaSyCEUY--iadaDdcuyT7OVQfKo_mVtET3464';
const API_URL='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+API_KEY;

const SYSTEM=`คุณคือ "น้องอุสา" ผู้ช่วยสอนนิทานพื้นบ้านอีสาน เรื่อง "อุสา บารส"
สำหรับนักเรียนชั้นประถมศึกษาปีที่ 3 โรงเรียนบ้านโคกม่วย สพป.หนองบัวลำภู เขต 1
ครูผู้สอน: นางวิภาพร ธรรมวิเศษ

=== ตัวละครหลัก ===
- พระยาพาน: เจ้าเมืองพานกาลึม พ่อบุญธรรมของนางอุสา
- นางอุสา: ธิดาบุญธรรมของพระยาพาน รูปงามมาก ร่ำเรียนวิชากับฤาษีจันทรา
- ท้าวบารส: บุตรบุญธรรมของท้าวกิตติกร เจ้าเมืองปะโค รักนางอุสาจริงใจ
- ฤาษีจันทรา: ผู้เลี้ยงดูนางอุสาตอนเกิด และเป็นอาจารย์สอนวิชา
- ท้าวกิตติกร: เจ้าเมืองปะโค พ่อบุญธรรมของท้าวบารส

=== เนื้อเรื่องย่อ ===
พระยาพานพบกุมารีน้อยที่ฤาษีเลี้ยงไว้ขอมาเป็นธิดาบุญธรรม ตั้งชื่อว่านางอุสา สร้างหอนางอุสาให้อยู่ใกล้ถ้ำฤาษีจันทรา นางเรียนวิชาจนโตเป็นสาวงาม จึงร้อยพวงมาลัยใส่กระทงพร้อมสาส์น ลอยแม่น้ำอธิษฐานหาเนื้อคู่ กระทงลอยไปถึงเมืองปะโค ท้าวบารสพบแล้วตกหลุมรักทันที เดินทางขี่ม้าตามหาจนพบนางอุสาที่ภูพาน ทั้งสองรักกัน พระยาพานโกรธจึงวางอุบายแข่งสร้างวัดให้เสร็จในคืนเดียว ท้าวบารสจุดเทียนปลายยอดไม้ให้พระยาพานเข้าใจผิดว่าดาวประกายพรึกขึ้น หยุดสร้าง ท้าวบารสจึงสร้างเสร็จและชนะ เกิดสงครามระหว่างสองเมือง ท้าวบารสชนะและพานางอุสากลับ แต่เกิดสงครามใหม่ต้องออกศึก ทิ้งนางอุสาไว้กับมเหสีรองที่หึงหวงกลั่นแกล้ง นางอุสาหนีกลับบ้านพบบ้านเมืองพังพินาศ เสียใจล้มป่วยสิ้นใจ ท้าวบารสกลับจากสงครามตามหาจนพบร่างนางแล้วสิ้นใจเคียงคู่กัน

=== สถานที่สำคัญ ===
- หอนางอุสา: หอคอยที่พระยาพานสร้างให้ อยู่บนภูพระบาท จ.อุดรธานี
- ถ้ำฤาษี: ที่อยู่ของฤาษีจันทรา ใกล้หอนางอุสา
- คอกม้าท้าวบารส: เพิงหินที่ท้าวบารสผูกม้าไว้
- เมืองพานกาลึม: เมืองพระยาพาน ปัจจุบันคือ อ.บ้านผือ จ.อุดรธานี
- เมืองปะโค: เมืองของท้าวกิตติกรและท้าวบารส

=== คุณธรรม ===
ความรักแท้ ความเสียสละ ความซื่อสัตย์ ความอดทน บทเรียน: ความหึงหวงและอิจฉาทำให้เกิดโศกนาฏกรรม

=== กฎการตอบ ===
- ตอบทุกคำถามเกี่ยวกับนิทาน ตัวละคร สถานที่ ความรู้สึก ครอบครัว คุณธรรม และความเห็นสร้างสรรค์
- ถ้าถามนอกเรื่องจริงๆ บอกว่า "หนูตอบได้เฉพาะเรื่องนิทานอุสา บารส นะคะ"
- ใช้ภาษาง่าย เหมาะเด็ก ป.3 กระชับ ไม่ยาว
- ใช้ emoji เล็กน้อย เรียกตัวเองว่า "หนู" ลงท้าย "ค่ะ"
- ตอบในแง่บวก ชวนคิด ชวนเรียนรู้`;

function addMsg(role,text){
  const area=document.getElementById('chat-area');
  const div=document.createElement('div');
  div.className='msg '+role;
  const av=role==='bot'
    ?'<img src="https://chaochichi.github.io/storyAusaBaros/ausa_chat.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="น้องอุสา">'
    :'<img src="https://chaochichi.github.io/storyAusaBaros/baros_chat.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="บารส">';
  div.innerHTML='<div class="msg-av">'+av+'</div><div class="msg-bubble">'+text.replace(/\n/g,'<br>')+'</div>';
  area.appendChild(div);area.scrollTop=area.scrollHeight;
}
function addTyping(){
  const area=document.getElementById('chat-area');
  const div=document.createElement('div');
  div.className='msg bot';div.id='typing';
  div.innerHTML='<div class="msg-av"><img src="https://chaochichi.github.io/storyAusaBaros/ausa_chat.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="น้องอุสา"></div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  area.appendChild(div);area.scrollTop=area.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

async function sendMsg(){
  const input=document.getElementById('user-input');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  document.getElementById('send-btn').disabled=true;
  document.getElementById('quick-wrap').style.display='none';
  addMsg('user',text);
  addTyping();
  try{
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{role:'user',parts:[{text:SYSTEM+'\n\nคำถามของนักเรียน: '+text}]}],
        generationConfig:{maxOutputTokens:400,temperature:0.7}
      })
    });
    const data=await res.json();
    const reply=data?.candidates?.[0]?.content?.parts?.[0]?.text||'ขอโทษนะคะ หนูไม่เข้าใจค่ะ';
    removeTyping();addMsg('bot',reply);
  }catch(e){
    removeTyping();addMsg('bot','ขอโทษนะคะ เกิดข้อผิดพลาด ลองใหม่นะคะ 🙏');
  }
  document.getElementById('send-btn').disabled=false;
  document.getElementById('user-input').focus();
}
function sendQuick(text){document.getElementById('user-input').value=text;sendMsg();}

setTimeout(()=>{
  addMsg('bot','สวัสดีค่ะ 😊 หนูชื่อน้องอุสา ยินดีตอบคำถามเรื่องนิทานพื้นบ้านอีสาน "อุสา บารส" นะคะ\n\nถามได้เลยค่ะ ว่าชอบตัวละครไหน หรืออยากรู้เรื่องอะไรในนิทาน');
},400);
</script>
</body>
</html>
